name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The GT6CE jar is not in git, so CI builds it from the commit we pin.
      - name: Read pinned GT6CE commit
        run: echo "GT6CE_COMMIT=$(tr -d '[:space:]' < libs/gt6ce/build-commit.txt)" >> "$GITHUB_ENV"

      - name: Restore GT6CE jars
        id: gt6ce-cache
        uses: actions/cache/restore@v4
        with:
          path: libs/gt6ce/*.jar
          key: gt6ce-neoforge-sdk-1.21.1-${{ env.GT6CE_COMMIT }}

      - name: Checkout GT6CE
        if: steps.gt6ce-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: SaltNya/GregTech6
          ref: ${{ env.GT6CE_COMMIT }}
          path: gt6ce-src
          submodules: recursive

      - name: Setup JDK 17 for GT6CE
        if: steps.gt6ce-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Record JDK 17
        if: steps.gt6ce-cache.outputs.cache-hit != 'true'
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Record JDK 21
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GT6CE runs Gradle on JDK 17 and needs JDK 21 as a toolchain for NeoForge.
      - name: Build GT6CE
        if: steps.gt6ce-cache.outputs.cache-hit != 'true'
        working-directory: gt6ce-src
        env:
          JAVA_HOME: ${{ env.JAVA17_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Dorg.gradle.java.home="$JAVA17_HOME" \
            -Dorg.gradle.java.installations.fromEnv=JAVA17_HOME,JAVA21_HOME \
            -Dorg.gradle.java.installations.auto-download=false \
            :minecraft:1.21.1-neoforge:build
          shopt -s nullglob
          copy_one() {
            local label="$1"
            local destination="$2"
            shift 2
            local jars=("$@")
            local selected=()
            local jar
            for jar in "${jars[@]}"; do
              case "$jar" in
                *-sources.jar|*-javadoc.jar|*-dev.jar) ;;
                *) selected+=("$jar") ;;
              esac
            done
            if [ "${#selected[@]}" -ne 1 ]; then
              echo "Expected one $label, found: ${selected[*]:-none}"
              echo "build-commit.txt must name a GT6CE commit that publishes the common API and the NeoForge SDK."
              exit 1
            fi
            cp "${selected[0]}" "$destination"
          }
          copy_one "GT6CE common API" ../libs/gt6ce/ api/common/build/libs/gt6ce-api-*.jar
          copy_one "GT6CE addon SDK" ../libs/gt6ce/ \
            minecraft/versions/1.21.1-neoforge/build/addon-sdk/gt6ce-addon-sdk-1.21.1-neoforge-*.jar
          jars=()
          for jar in minecraft/versions/1.21.1-neoforge/build/libs/*.jar; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-dev.jar) ;;
              *)
                if unzip -p "$jar" META-INF/neoforge.mods.toml >/dev/null 2>&1; then
                  jars+=("$jar")
                fi
                ;;
            esac
          done
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one GT6CE NeoForge jar, found: ${jars[*]:-none}"
            exit 1
          fi
          cp "${jars[0]}" ../libs/gt6ce/gt6ce-1.21.1-neoforge.jar

      - name: Cache GT6CE jars
        if: steps.gt6ce-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: libs/gt6ce/*.jar
          key: gt6ce-neoforge-sdk-1.21.1-${{ env.GT6CE_COMMIT }}

      - name: Compare GT6CE jar with the recorded checksum
        working-directory: libs/gt6ce
        run: |
          if ! sha256sum --check --status gt6ce-1.21.1-neoforge.jar.sha256; then
            echo "::warning::GT6CE jar built from $GT6CE_COMMIT differs from the recorded checksum."
          fi

      - name: Build with Gradle
        run: ./gradlew build
